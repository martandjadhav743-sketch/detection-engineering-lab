title: Kerberos Password Spraying Across Multiple Accounts
id: a1b9e4c7-52d8-4b36-9f24-7e6c8d3a5b91
status: experimental
description: >
  Detects multiple Kerberos pre-authentication failures from the same source
  IP address against multiple user accounts within a short time window. This
  pattern may indicate password spraying.
references:
  - https://attack.mitre.org/techniques/T1110/003/
  - https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES
tags:
  - attack.credential_access
  - attack.t1110.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4768
    Status: '0x6'
  condition: selection | count(TargetUserName) by IpAddress >= 3
  timeframe: 5m
falsepositives:
  - Users mistyping passwords repeatedly
  - Applications or services using expired credentials
  - Legacy systems with misconfigured authentication
  - Authorized security testing
level: high