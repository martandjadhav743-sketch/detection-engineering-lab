title: Repeated Failed Logons from Same Source IP
id: 7f3a2c1e-8b64-4f7a-9d21-6b8f5a1c4e92
status: experimental
description: >
  Detects repeated failed authentication attempts from the same source IP address.
  This may indicate password guessing, credential stuffing, or an authentication issue.
references:
  - https://attack.mitre.org/techniques/T1110/
tags:
  - attack.credential_access
  - attack.t1110
logsource:
  product: windows
  service: security
detection:
  selection:
    event_id: 4625
  condition: selection
falsepositives:
  - A user repeatedly entering an incorrect password
  - A service using an expired or incorrect credential
  - A legitimate application with a misconfigured authentication setting
level: medium